<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>yazenugb Portal</title>
    <style>
        :root {
            --bg: #090d16;
            --card-bg: #111827;
            --border: #1f2937;
            --accent: #6366f1;
            --accent-hover: #4f46e5;
            --text: #f9fafb;
            --text-muted: #9ca3af;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg);
            color: var(--text);
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }

        .container {
            width: 100%;
            max-width: 650px;
            padding: 0 20px;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            align-items: center;
            animation: fadeIn 0.5s ease-out;
        }

        h1 {
            font-size: 2.75rem;
            margin-bottom: 0.5rem;
            font-weight: 800;
            letter-spacing: -0.05em;
            background: linear-gradient(to right, #818cf8, #c084fc);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        p {
            color: var(--text-muted);
            margin-bottom: 2rem;
            font-size: 1rem;
        }

        form {
            display: flex;
            width: 100%;
            background: var(--card-bg);
            border-radius: 14px;
            border: 1px solid var(--border);
            overflow: hidden;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.4), 0 10px 10px -5px rgba(0, 0, 0, 0.2);
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        form:focus-within {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.2), 0 20px 25px -5px rgba(0, 0, 0, 0.4);
        }

        input {
            flex: 1;
            background: transparent;
            border: none;
            padding: 18px 22px;
            color: var(--text);
            font-size: 1.05rem;
            outline: none;
        }

        input::placeholder {
            color: var(--text-muted);
        }

        button {
            background: var(--accent);
            border: none;
            color: white;
            padding: 0 28px;
            font-weight: 600;
            font-size: 1rem;
            cursor: pointer;
            transition: background 0.2s;
        }

        button:hover {
            background: var(--accent-hover);
        }

        .shortcuts {
            display: flex;
            gap: 12px;
            margin-top: 20px;
        }

        .shortcut-btn {
            background: var(--card-bg);
            border: 1px solid var(--border);
            color: var(--text-muted);
            padding: 8px 16px;
            border-radius: 8px;
            font-size: 0.85rem;
            cursor: pointer;
            transition: all 0.2s;
        }

        .shortcut-btn:hover {
            background: var(--border);
            color: var(--text);
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>yazenugb</h1>
        <p>Secure, unblocked web gateway</p>
        
        <form id="form">
            <input id="input" type="text" placeholder="Search Google or type a URL..." autocomplete="off" autofocus>
            <button type="submit">Go</button>
        </form>

        <div class="shortcuts">
            <button class="shortcut-btn" onclick="quickNav('https://www.google.com')">Google</button>
            <button class="shortcut-btn" onclick="quickNav('https://www.youtube.com')">YouTube</button>
            <button class="shortcut-btn" onclick="quickNav('https://discord.com')">Discord</button>
            <button class="shortcut-btn" onclick="quickNav('https://www.reddit.com')">Reddit</button>
        </div>
    </div>

    <!-- Ultraviolet script bundle loaded straight from CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@titaniumnetwork-dev/ultraviolet@3.2.7/dist/uv.bundle.js"></script>
    <script>
        window.__uv$config = {
            prefix: '/uv/service/',
            bare: 'https://bare.benrogo.net/',
            encodeUrl: Ultraviolet.codec.xor.encode,
            decodeUrl: Ultraviolet.codec.xor.decode,
            handler: 'https://cdn.jsdelivr.net/npm/@titaniumnetwork-dev/ultraviolet@3.2.7/dist/uv.handler.js',
            client: 'https://cdn.jsdelivr.net/npm/@titaniumnetwork-dev/ultraviolet@3.2.7/dist/uv.client.js',
            bundle: 'https://cdn.jsdelivr.net/npm/@titaniumnetwork-dev/ultraviolet@3.2.7/dist/uv.bundle.js',
            config: 'https://cdn.jsdelivr.net/npm/@titaniumnetwork-dev/ultraviolet@3.2.7/dist/uv.config.js'
        };

        const form = document.getElementById('form');
        const input = document.getElementById('input');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            let val = input.value.trim();
            if (!val) return;
            navigate(val);
        });

        function quickNav(url) {
            navigate(url);
        }

        function navigate(val) {
            let url = val;
            // Check if it's a search query or a valid URL
            if (!isUrl(url)) {
                url = 'https://www.google.com/search?q=' + encodeURIComponent(url);
            } else if (!(url.startsWith('http://') || url.startsWith('https://'))) {
                url = 'https://' + url;
            }
            window.location.href = __uv$config.prefix + __uv$config.encodeUrl(url);
        }

        function isUrl(val = '') {
            return /^http(s?):\/\//.test(val) || (val.includes('.') && !val.includes(' '));
        }
    </script>
</body>
</html>
